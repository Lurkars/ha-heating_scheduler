name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Verify tag matches manifest.json version
        run: |
          tag_version="${GITHUB_REF_NAME#v}"
          manifest_version="$(python3 -c "import json; print(json.load(open('custom_components/heating_scheduler/manifest.json'))['version'])")"
          if [ "$tag_version" != "$manifest_version" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match manifest.json version $manifest_version"
            exit 1
          fi

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --generate-notes
